name: CI / Release

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION:       'NetBindPro.sln'
  CONFIGURATION:  'Release'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Validation build on every push / PR.
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (x64)
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:Platform=x64

  # ─────────────────────────────────────────────────────────────────────────
  # On a version tag: build the real artifacts, make the installer, publish it.
  release:
    name: Build installer & publish release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # UI: self-contained .NET 8 — the runtime is bundled, users install nothing else.
      - name: Publish UI (self-contained net8, x64)
        run: >
          dotnet publish src/NetBindPro.UI/NetBindPro.UI.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output publish/win-x64 /p:Platform=x64

      # Hook: .NET Framework 4.8 (EasyHook can only inject a Framework payload).
      # net48 is present on all Windows 10/11, so nothing is bundled for it.
      - name: Build Hook (net48, x64)
        run: dotnet build src/NetBindPro.Hook/NetBindPro.Hook.csproj --configuration Release /p:Platform=x64

      - name: Copy Hook x64 output (exe + EasyHook natives) next to UI
        shell: pwsh
        run: Copy-Item src/NetBindPro.Hook/bin/x64/Release/net48/* publish/win-x64 -Recurse -Force

      - name: Build Hook (net48, x86)
        run: dotnet build src/NetBindPro.Hook/NetBindPro.Hook.csproj --configuration Release /p:Platform=x86

      - name: Copy Hook x86 output into x86 subfolder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/win-x64/x86 -Force | Out-Null
          Copy-Item src/NetBindPro.Hook/bin/x86/Release/net48/* publish/win-x64/x86 -Recurse -Force

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/NetBindPro.Setup.iss
          options: /O"publish/installer"

      - name: Extract release notes for this version
        shell: bash
        run: awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NetBind Pro ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            publish/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
